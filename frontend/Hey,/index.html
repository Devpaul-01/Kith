<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Kith</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F8FAFC}
    #splash{position:fixed;inset:0;background:#F8FAFC;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s ease}
    #splash.fade-out{opacity:0;pointer-events:none}
    .splash-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
    .splash-logo{font-size:2.5rem;font-weight:800;color:#0F172A;letter-spacing:-0.05em}
    .splash-logo span{color:#2563EB}
    .splash-sub{font-size:.75rem;color:#94A3B8;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
    .splash-spinner{width:26px;height:26px;border:2.5px solid #DBEAFE;border-top-color:#2563EB;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-logo">ki<span>th</span></div>
      <div class="splash-sub">Family &amp; Community</div>
      <div class="splash-spinner"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
