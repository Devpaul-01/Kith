name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (if present)
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.js' 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "No unit tests found yet — skipping."
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  integration-tests:
    name: Integration & Rate-Limit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres-test:
        # Plain Postgres is enough: the schema is self-contained
        # (migrations/001_schema.sql) and tests use the `postgres` role.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kith_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-test:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply DB schema
        run: psql -h localhost -p 54322 -U postgres -d kith_test -v ON_ERROR_STOP=1 -f migrations/001_schema.sql

      # PostgREST listens on 3002. supabase-js requests `<url>/rest/v1/...`,
      # which bare PostgREST 404s, so backend/scripts/local-test-stack/
      # pgrst-proxy.js listens on 3001 and strips the /rest/v1 prefix.
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest-test \
            --network host \
            -e PGRST_DB_URI="postgres://postgres:test@localhost:54322/kith_test" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="postgres" \
            -e PGRST_SERVER_PORT="3002" \
            -e PGRST_JWT_SECRET="test-jwt-secret-at-least-32-characters-long" \
            postgrest/postgrest:v12.0.2

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/workspaces?limit=1 > /dev/null; then
              echo "PostgREST is up and sees the schema."
              exit 0
            fi
            sleep 2
          done
          echo "PostgREST did not become ready:"
          curl -s http://localhost:3002/workspaces?limit=1 || true
          docker logs postgrest-test --tail 50
          exit 1

      - name: Start PostgREST /rest/v1 proxy
        run: |
          nohup node backend/scripts/local-test-stack/pgrst-proxy.js > /tmp/pgrst-proxy.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3001/rest/v1/workspaces?limit=1 > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pgrst-proxy.log
          exit 1

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/1

      - name: Run rate-limit tests
        run: npm run test:ratelimit
        working-directory: backend
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/2

      - name: Show PostgREST logs on failure
        if: failure()
        run: docker logs postgrest-test --tail 100 || true
