name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (if present)
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.js' 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "No unit tests found yet — skipping."
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # RATE-LIMIT TESTS TEMPORARILY DISABLED (requested by maintainer).
  # The job definition is kept intact; remove the `if: false` line below to
  # re-enable it. It depends on the same Postgres/PostgREST setup as the
  # disabled integration-tests job.
  rate-limit-tests:
    name: Rate-Limit Tests
    if: false
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kith_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-test:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Redis to be ready
        run: |
          sudo apt-get install -y redis-tools
          until redis-cli -h localhost -p 63790 ping | grep -q PONG; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "✅ Redis is up."

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 54322 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      # migrations/002-004 were deleted from the repo (commit 2cd03de,
      # "remove stale audit docs and superseded migrations") but this
      # step still referenced them by filename, so `psql -f` failed with
      # "No such file or directory" and aborted the job before PostgREST
      # or the test suite ever ran. 001_schema.sql is the only migration
      # file left in the repo, so that's the only one applied here.
      #
      # NOTE: all of the former 002-004 fixes are now in 001_schema.sql:
      # the set_contributor_target_atomic retry loop, the ledger_entries
      # immutability triggers (enforce_ledger_entry_immutability /
      # prevent_locked_ledger_entry_delete) and the advisory-lock duplicate
      # check in create_ledger_entry_checked. (An earlier version of this
      # comment said the latter two were lost; that is no longer true.)
      - name: Run DB migrations
        run: |
          psql -h localhost -p 54322 -U postgres -d kith_test -v ON_ERROR_STOP=1 -f migrations/001_schema.sql
        env:
          PGPASSWORD: test

      - name: Start PostgREST
        run: |
          docker run -d --name postgrest-test \
            --network host \
            -e PGRST_DB_URI="postgres://postgres:test@localhost:54322/kith_test" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="postgres" \
            -e PGRST_SERVER_PORT="3001" \
            -e PGRST_JWT_SECRET="test-jwt-secret-at-least-32-characters-long" \
            postgrest/postgrest:v12.0.2

          echo "Waiting for PostgREST to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ > /dev/null 2>&1; then
              echo "PostgREST is up."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3001/ || (echo "PostgREST failed to start:" && docker logs postgrest-test && exit 1)

      # supabase-js sends SUPABASE_SERVICE_ROLE_KEY as a Bearer token to
      # PostgREST, which decodes it as a JWT (PGRST_JWT_SECRET above). It
      # must be a real JWT signed with that same secret — a placeholder
      # string isn't valid and PostgREST rejects it with "JWSError
      # (CompactDecodeError Invalid number of parts: Expected 3 parts;
      # got 1)". Mint one here with the `service_role` claim so RLS-
      # bypass behaves the way it does against real Supabase.
      - name: Generate service-role JWT for PostgREST
        working-directory: backend
        run: |
          echo "SERVICE_ROLE_JWT=$(node -e "
            console.log(require('jsonwebtoken').sign(
              { role: 'service_role' },
              'test-jwt-secret-at-least-32-characters-long',
              { expiresIn: '1h' }
            ));
          ")" >> "$GITHUB_ENV"

      - name: Reload PostgREST schema cache
        run: |
          psql -h localhost -p 54322 -U postgres -d kith_test -c "NOTIFY pgrst, 'reload schema';"
          sleep 2

          echo "Waiting for workspaces table to be visible via PostgREST..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/workspaces?limit=1 > /dev/null 2>&1; then
              echo "✅ workspaces table is accessible"
              break
            fi
            echo "Attempt $i: workspaces not yet available, waiting..."
            sleep 2
          done

          if curl -sf http://localhost:3001/workspaces?limit=1 > /dev/null 2>&1; then
            echo "✅ PostgREST schema cache successfully loaded 'workspaces' table"
          else
            echo "❌ PostgREST schema cache does not see 'workspaces' after reload"
            echo "Response: $(curl -s http://localhost:3001/workspaces?limit=1)"
            echo ""
            echo "PostgREST logs:"
            docker logs postgrest-test --tail 50
            exit 1
          fi
        env:
          PGPASSWORD: test

      - name: Diagnose PostgREST schema visibility (if previous step fails)
        if: failure()
        run: |
          echo "--- Does psql see the table? ---"
          psql -h localhost -p 54322 -U postgres -d kith_test -c "\dt public.workspaces"

          echo "--- What grants exist for workspaces? ---"
          psql -h localhost -p 54322 -U postgres -d kith_test -c "
            SELECT grantee, privilege_type
            FROM information_schema.role_table_grants
            WHERE table_name = 'workspaces';
          "

          echo "--- Raw PostgREST error body ---"
          curl -s http://localhost:3001/workspaces?limit=1

          echo "--- PostgREST logs ---"
          docker logs postgrest-test --tail 50
        env:
          PGPASSWORD: test

      - name: Run rate-limit tests
        run: npm run test:ratelimit
        working-directory: backend
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_JWT }}
          TEST_REDIS_URL: redis://localhost:63790/2

      - name: Show PostgREST logs on failure
        if: failure()
        run: docker logs postgrest-test || true

