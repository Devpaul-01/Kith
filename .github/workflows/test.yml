name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (if present)
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.js' 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "No unit tests found yet — skipping."
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  integration-tests:
    name: Integration & Rate-Limit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres-test:
        # Plain Postgres is enough: the schema is self-contained
        # (migrations/001_schema.sql) and tests use the `postgres` role.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kith_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-test:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: test
      # Direct DB access for test cleanup: ledger_entries / audit_log are
      # protected by delete-blocking triggers that PostgREST can't bypass.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:54322/kith_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply DB schema
        run: psql -h localhost -p 54322 -U postgres -d kith_test -v ON_ERROR_STOP=1 -f migrations/001_schema.sql

      # PostgREST listens on 3002. supabase-js requests `<url>/rest/v1/...`,
      # which bare PostgREST 404s, so backend/scripts/local-test-stack/
      # pgrst-proxy.js listens on 3001 and strips the /rest/v1 prefix.
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest-test \
            --network host \
            -e PGRST_DB_URI="postgres://postgres:test@localhost:54322/kith_test" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="postgres" \
            -e PGRST_SERVER_PORT="3002" \
            -e PGRST_JWT_SECRET="test-jwt-secret-at-least-32-characters-long" \
            postgrest/postgrest:v12.0.2

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/workspaces?limit=1 > /dev/null; then
              echo "PostgREST is up and sees the schema."
              exit 0
            fi
            sleep 2
          done
          echo "PostgREST did not become ready:"
          curl -s http://localhost:3002/workspaces?limit=1 || true
          docker logs postgrest-test --tail 50
          exit 1

      - name: Start PostgREST /rest/v1 proxy
        run: |
          nohup node backend/scripts/local-test-stack/pgrst-proxy.js > /tmp/pgrst-proxy.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3001/rest/v1/workspaces?limit=1 > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pgrst-proxy.log
          exit 1

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/1

      - name: Run rate-limit tests
        run: npm run test:ratelimit
        working-directory: backend
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/2

      - name: Show PostgREST logs on failure
        if: failure()
        run: docker logs postgrest-test --tail 100 || true

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The app's real signup/login goes through supabase-js's auth
      # client, which calls a GoTrue-compatible /auth/v1/* endpoint —
      # something bare PostgREST (used by the integration-tests job
      # above) doesn't provide. @supabase/lite is a real, npm-distributed
      # local Supabase implementation (PostgREST + GoTrue compatible,
      # backed by an embedded Postgres) that lets E2E tests exercise
      # actual signup/login through the real UI, rather than a seeded or
      # mocked auth bypass. See docs/e2e-local-setup.md for the full
      # rationale and a manual walkthrough of these same steps.
      - name: Set up local Supabase stack (@supabase/lite)
        run: |
          mkdir -p /tmp/e2e-stack && cd /tmp/e2e-stack
          npm init -y > /dev/null
          npm install @supabase/lite --no-audit --no-fund
          npx lite init --pglite
          cp "$GITHUB_WORKSPACE/migrations/001_schema.sql" ./supabase/schemas/schema.sql
          npx lite db diff -f kith_schema
          npx lite migration up

          # Keys are generated fresh by `lite init`; export them for the
          # backend/frontend env steps below.
          cat .env >> "$GITHUB_ENV"

          nohup npx lite start > /tmp/lite.log 2>&1 &
          for i in $(seq 1 30); do
            # /rest/v1/ with no table name returns 403 even when the
            # server is healthy, so probe a real table from the schema
            # we just migrated instead.
            if curl -sf "http://127.0.0.1:54321/rest/v1/users?limit=1" -H "apikey: $(grep SUPABASE_PUBLISHABLE_KEY .env | cut -d= -f2)" > /dev/null; then
              echo "lite is up."
              exit 0
            fi
            sleep 2
          done
          echo "lite did not become ready:"
          cat /tmp/lite.log
          exit 1

      - name: Start Redis
        run: |
          sudo apt-get update && sudo apt-get install -y redis-server
          redis-server --daemonize yes --port 6379

      - name: Start backend
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: 3000
          API_BASE_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SECRET_KEY }}
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BUCKET_NAME: kith-files
          ADMIN_IP_WHITELIST: 127.0.0.1,::1
        run: |
          nohup node src/start-all.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: http://localhost:3000
        run: |
          npm run build
          nohup npm run preview -- --port 5173 --host > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not become ready:"
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show stack logs on failure
        if: failure()
        run: |
          echo "== lite ==" && cat /tmp/lite.log || true
          echo "== backend ==" && cat /tmp/backend.log || true
          echo "== frontend ==" && cat /tmp/frontend.log || true
