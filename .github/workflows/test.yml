name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (if present)
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.js' 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "No unit tests found yet — skipping."
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  integration-tests:
    name: Integration & Rate Limit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Single source of truth shared with docker-compose.test.yml and
      # tests/setup.integration.js / tests/setup.ratelimit.js, so the
      # PostgREST JWT secret used to bring services up here always matches
      # the one the test setup files sign their service-role/anon JWTs
      # with — a mismatch here is exactly what used to make every
      # Postgres-touching call fail with a JWT signature error.
      TEST_JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      TEST_SUPABASE_URL: http://localhost:3001
      TEST_REDIS_URL_INTEGRATION: redis://localhost:63790/1
      TEST_REDIS_URL_RATELIMIT: redis://localhost:63790/2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Reuses the repo's own docker-compose.test.yml (the same file a
      # developer runs locally via `npm run test:docker:up`) instead of a
      # hand-rolled `docker run`, so CI and local dev can't drift apart
      # again the way they did before.
      #
      # IMPORTANT: postgrest-test is started separately, AFTER migrations
      # run — not in this first `up -d` (see docker-compose.test.yml's
      # header comment for why starting PostgREST against an empty
      # database and relying on a later `NOTIFY pgrst, 'reload schema'`
      # is not reliable for DML, even when a plain GET against the
      # reloaded table succeeds).
      - name: Start Postgres & Redis
        run: docker compose -f docker-compose.test.yml up -d postgres-test redis-test

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 54322 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Wait for Redis to be ready
        run: |
          sudo apt-get install -y redis-tools
          until redis-cli -h localhost -p 63790 ping | grep -q PONG; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "✅ Redis is up."

      - name: Run DB migrations
        # migrations/ lives at the repo root, not under backend/ (this
        # job's working-directory) — apply every migration in order so
        # newer ones (e.g. 002_*) aren't silently skipped the way
        # 001 was when this path previously pointed at a nonexistent
        # backend/migrations/001_schema.sql.
        run: |
          for f in $(ls ../migrations/*.sql | sort); do
            echo "Applying $f..."
            psql -h localhost -p 54322 -U postgres -d kith_test -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGPASSWORD: test

      - name: Start PostgREST and wait for table visibility
        run: |
          # Only now does PostgREST connect — the schema already exists,
          # so its first-boot schema cache is correct from the start
          # (see docker-compose.test.yml's header comment for why this
          # ordering matters for DML, not just reads).
          docker compose -f docker-compose.test.yml up -d postgrest-test

          echo "Waiting for workspaces table to be visible via PostgREST..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/workspaces?limit=1 > /dev/null 2>&1; then
              echo "✅ workspaces table is accessible"
              break
            fi
            echo "Attempt $i: workspaces not yet available, waiting..."
            sleep 2
          done

          if ! curl -sf http://localhost:3001/workspaces?limit=1 > /dev/null 2>&1; then
            echo "❌ PostgREST schema cache does not see 'workspaces'"
            echo "Response: $(curl -s http://localhost:3001/workspaces?limit=1)"
            echo ""
            echo "PostgREST logs:"
            docker compose -f docker-compose.test.yml logs postgrest-test --tail 50
            exit 1
          fi

          # Sanity-check a write, not just a read — a GET succeeding is
          # not sufficient proof the cache is fully correct for DML (this
          # is exactly the gap that broke every test in the previous
          # version of this workflow: GET /workspaces worked right after
          # a NOTIFY-triggered reload, but every POST/INSERT through
          # supabase-js failed). Probes `users` (no FK dependencies) with
          # a throwaway row, the same way seedWorkspaceWithAdmin's very
          # first insert does.
          echo "Verifying PostgREST can accept a write..."
          probe_id="00000000-0000-0000-0000-000000000001"
          probe_response=$(curl -s -o /tmp/probe_body.json -w "%{http_code}" -X POST \
            "http://localhost:3001/users" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"id\":\"$probe_id\",\"email\":\"ci-postgrest-probe@example.test\"}")
          echo "Probe insert HTTP status: $probe_response"
          cat /tmp/probe_body.json
          echo ""
          if [ "$probe_response" != "201" ]; then
            echo "❌ PostgREST rejected a test write — schema cache is not fully ready for DML"
            echo "PostgREST logs:"
            docker compose -f docker-compose.test.yml logs postgrest-test --tail 50
            exit 1
          fi
          curl -s -X DELETE "http://localhost:3001/users?id=eq.$probe_id" > /dev/null
          echo "✅ PostgREST accepts writes"

      - name: Diagnose PostgREST schema visibility (if previous step fails)
        if: failure()
        run: |
          echo "--- Does psql see the table? ---"
          psql -h localhost -p 54322 -U postgres -d kith_test -c "\dt public.workspaces"

          echo "--- What grants exist for workspaces? ---"
          psql -h localhost -p 54322 -U postgres -d kith_test -c "
            SELECT grantee, privilege_type
            FROM information_schema.role_table_grants
            WHERE table_name = 'workspaces';
          "

          echo "--- Raw PostgREST error body (GET) ---"
          curl -s http://localhost:3001/workspaces?limit=1

          echo "--- PostgREST logs ---"
          docker compose -f docker-compose.test.yml logs postgrest-test --tail 50
        env:
          PGPASSWORD: test

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          TEST_REDIS_URL: ${{ env.TEST_REDIS_URL_INTEGRATION }}
          TEST_JWT_SECRET: ${{ env.TEST_JWT_SECRET }}

      - name: Run rate-limit tests
        run: npm run test:ratelimit
        env:
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          TEST_REDIS_URL: ${{ env.TEST_REDIS_URL_RATELIMIT }}
          TEST_JWT_SECRET: ${{ env.TEST_JWT_SECRET }}

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 100