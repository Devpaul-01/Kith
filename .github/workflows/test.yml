name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Unit tests are maintained separately and may not exist yet in
      # every branch. This step does not fail the build if tests/unit/
      # is empty or absent — it only runs the unit project when there's
      # something to run.
      - name: Run unit tests (if present)
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.js' 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "No unit tests found yet — skipping."
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kith_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-test:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 54322 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Apply schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -p 54322 -U postgres -d kith_test -f migrations/001_schema.sql

      # PostgREST is what @supabase/supabase-js actually talks to (a REST
      # API in front of Postgres, not the Postgres wire protocol itself —
      # see docker-compose.test.yml's header comment for the full
      # explanation). GitHub Actions' `services:` block only supports
      # images with fixed startup commands, so PostgREST is started here
      # as a plain background container on the job's own network
      # namespace instead, where it can reach Postgres via localhost.
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest-test \
            --network host \
            -e PGRST_DB_URI="postgres://postgres:test@localhost:54322/kith_test" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="postgres" \
            -e PGRST_SERVER_PORT="3001" \
            -e PGRST_JWT_SECRET="test-jwt-secret-at-least-32-characters-long" \
            postgrest/postgrest:v12.0.2

          echo "Waiting for PostgREST..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3001/ > /dev/null 2>&1; then
              echo "PostgREST is up."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3001/ || (echo "PostgREST failed to start:" && docker logs postgrest-test && exit 1)

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/1

      - name: Run rate-limit tests
        run: npm run test:ratelimit
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/2

      - name: Show PostgREST logs on failure
        if: failure()
        run: docker logs postgrest-test || true
