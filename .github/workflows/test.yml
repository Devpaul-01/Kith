name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (if present)
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.js' 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "No unit tests found yet — skipping."
          fi

  integration-tests:
    name: Integration & Rate-Limit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      PGPASSWORD: test
      # Both the app (via jest setup files) and this job's own psql/curl
      # steps need to agree on the exact same JWT secret, or PostgREST
      # will reject the test suite's signed tokens. Centralized here
      # instead of re-declared per step.
      TEST_JWT_SECRET: test-jwt-secret-at-least-32-characters-long

    # All three services run as native GitHub Actions service containers
    # (Docker bridge network, port-mapped to the runner's localhost) so
    # they come up, get health-checked, and become reachable via
    # `localhost:<port>` the same consistent way for every step — unlike
    # a previous version of this workflow, which mixed this pattern with
    # a manually `docker run --network host`-started PostgREST container.
    # Mixing a GH Actions service container with a manually-run
    # --network host container is a known source of nondeterministic
    # "service unreachable" failures on hosted runners, because the two
    # containers don't reliably end up addressable the same way at the
    # same time. Running PostgREST as a service container too removes
    # that variable entirely.
    #
    # PostgREST itself is configured with PGRST_DB_URI pointing at the
    # OTHER service container by its service name (postgres-test), which
    # works because GH Actions puts all service containers for a job on
    # one shared Docker network together, regardless of the ports: each
    # also publishes to the runner host.
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kith_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-test:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgrest-test:
        image: postgrest/postgrest:v12.0.2
        env:
          PGRST_DB_URI: postgres://postgres:test@postgres-test:5432/kith_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: postgres
          PGRST_JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          PGRST_SERVER_PORT: 3000
        ports:
          - 3001:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to accept connections
        # pg_isready passing is necessary but NOT sufficient — the
        # official Postgres image can briefly accept TCP connections and
        # answer pg_isready while still re-execing for its real init on
        # first boot. Confirm with an actual query against the target DB
        # (not just the server) before trusting it's ready to be
        # migrated.
        run: |
          for i in $(seq 1 30); do
            if psql -h localhost -p 54322 -U postgres -d kith_test -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ Postgres is accepting queries against kith_test."
              break
            fi
            echo "Waiting for Postgres (attempt $i/30)..."
            sleep 2
          done
          psql -h localhost -p 54322 -U postgres -d kith_test -c "SELECT 1" > /dev/null

      - name: Wait for Redis to be ready
        run: |
          sudo apt-get install -y redis-tools
          for i in $(seq 1 30); do
            if redis-cli -h localhost -p 63790 ping | grep -q PONG; then
              echo "✅ Redis is up."
              break
            fi
            echo "Waiting for Redis (attempt $i/30)..."
            sleep 2
          done
          redis-cli -h localhost -p 63790 ping | grep -q PONG

      - name: Run DB migrations
        run: |
          psql -h localhost -p 54322 -U postgres -d kith_test -v ON_ERROR_STOP=1 \
            -f ../migrations/001_schema.sql

      - name: Reload PostgREST schema cache and verify visibility
        # PostgREST builds its schema cache from whatever existed in the
        # DB at connection time. Since this service container can start
        # (and open its DB connection) before migrations finish, NEVER
        # assume its initial cache is current — always NOTIFY after
        # migrating and then actively poll until the migrated tables are
        # actually visible through the REST API, rather than a fixed
        # sleep (fixed sleeps are exactly what made this flaky before:
        # sometimes enough, sometimes not, depending on runner load).
        run: |
          psql -h localhost -p 54322 -U postgres -d kith_test -c "NOTIFY pgrst, 'reload schema';"

          echo "Waiting for 'workspaces' to be visible via PostgREST..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3001/workspaces?limit=1" > /dev/null 2>&1; then
              echo "✅ workspaces table is accessible via PostgREST."
              ready=true
              break
            fi
            echo "Attempt $i/30: not visible yet, re-sending NOTIFY and waiting..."
            psql -h localhost -p 54322 -U postgres -d kith_test -c "NOTIFY pgrst, 'reload schema';" > /dev/null
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "❌ PostgREST schema cache never picked up 'workspaces'."
            echo "--- Raw PostgREST response ---"
            curl -s "http://localhost:3001/workspaces?limit=1"
            echo ""
            echo "--- psql: does the table exist? ---"
            psql -h localhost -p 54322 -U postgres -d kith_test -c "\dt public.workspaces"
            exit 1
          fi

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/1

      - name: Run rate-limit tests
        run: npm run test:ratelimit
        env:
          TEST_SUPABASE_URL: http://localhost:3001
          TEST_REDIS_URL: redis://localhost:63790/2

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- PostgREST: workspaces grants ---"
          psql -h localhost -p 54322 -U postgres -d kith_test -c "
            SELECT grantee, privilege_type
            FROM information_schema.role_table_grants
            WHERE table_name = 'workspaces';
          " || true
          echo "--- PostgREST: raw /workspaces response ---"
          curl -s "http://localhost:3001/workspaces?limit=1" || true
          echo ""
          echo "--- Redis: PING ---"
          redis-cli -h localhost -p 63790 ping || true
